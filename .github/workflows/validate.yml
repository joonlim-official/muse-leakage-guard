# Validates the leakage-guard harness against the synthetic stub.
#
# What green CI proves: the harness is self-consistent — the audit's
# plumbing, parsing, labels, and the report generator work against the
# bundled test double (test/stub-memory-skill). What it does NOT prove:
# that any real installation is protected. Only a run against the real
# installation speaks to protection. See references/gate-interface.md.
#
# Safety shape (deliberate):
# - pull_request (not pull_request_target): fork PRs get no write token.
# - permissions: contents: read; persist-credentials: false.
# - fetch-depth: 1: public history contains older private values; keep the
#   checkout shallow so a compromised step cannot exfiltrate full history.
# - Live-fire is refused: the audit exits 2 against stub targets, and this
#   workflow additionally fails fast if any live-fire variable is present.
# - No repository secrets are used or needed.
#
# Iteration-9 "composition pinning": the workflow asserts the audit total
# (@@@ TOTAL) and the adversarial figure (@@@ ADV MATCHED) equal their
# pinned values, so deleting checks or corpus cases cannot stay green.
# When the harness intentionally gains or loses checks, the pin is updated
# in the same commit as the check change.
# Iteration-6 "CI fails honest": this workflow tells the truth in both
# colors. Every component step runs even when an earlier component is red
# (fail-at-the-end via `if: always()`), captures its exit code to an rc
# file, and a final assert-green step owns the job outcome. The two Refuse
# steps stay fail-fast (no `if:`): they are safety preconditions, and the
# `always()` steps additionally require both refuse outcomes to be
# 'success' so a refused run never executes the audit. Every figure in
# the summary comes from an anchored @@@ machine sentinel, never from
# prose greps; a missing sentinel is reported as "unavailable", never
# silently dropped.

name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Stub-first: CI never needs the owner's real installation or local.env.
      PERSONAL_MEMORY_SKILL: ${{ github.workspace }}/test/stub-memory-skill
      MOCHI_AGENTS_FILE: ${{ github.workspace }}/test/stub-memory-skill/AGENTS.md
      CI: "true"
      # NOTE: MOCHI_EGRESS_LOG is intentionally NOT set here. The `runner`
      # context is unavailable in job-level `env:` — GitHub rejects the
      # whole workflow ("No jobs were run", run marked failed). It is
      # exported inside the `run:` scripts of the two steps that invoke
      # the gates (audit, report), where the `runner` context IS allowed
      # (via $RUNNER_TEMP).
    steps:
      - name: Check out the repo (shallow, no credentials)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Refuse live-fire variables
        id: refuse-livefire
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for v in MOCHI_LIVE_FIRE MOCHI_LIVE_FIRE_NONINTERACTIVE MOCHI_EGRESS_APPROVED; do
            if [ -n "${!v:-}" ]; then
              echo "::error::validate: refusing to run with $v set in CI" >&2
              exit 1
            fi
          done
          echo "validate: no live-fire variables present"

      - name: Refuse a committed local.env
        id: refuse-localenv
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if [ -e local.env ]; then
            echo "::error::validate: local.env must never be committed" >&2
            exit 1
          fi
          echo "validate: no local.env present"

      - name: Provision hermetic delegates
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Hermetic: runner-local directory, no sudo, no /usr/local/bin
          # writes. The audit requires a second, distinct executable behind
          # each shim on PATH (a shim must never be "tested" against
          # itself); these are inert (exit 0, touch nothing),
          # unmistakably synthetic, and never send anything. The audit's
          # own shim directory is prepended to PATH, so these resolve as
          # the delegate behind the stub shims.
          d="${{ runner.temp }}/delegates"
          mkdir -p "$d" "${{ runner.temp }}/rc"
          for cli in hatch_gws_cli hatch_messenger_cli; do
            printf '#!/usr/bin/env bash\n# Inert delegate for CI: stands in for the real CLI behind the stub shim. Never sends.\nexit 0\n' > "$d/$cli"
            chmod +x "$d/$cli"
          done
          echo "$d" >> "$GITHUB_PATH"
          ls -la "$d"

      - name: Inert-delegate smoke test
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # PATH lookup (hermetic): the provisioned delegates must resolve
          # and be inert. No absolute paths outside the runner.
          command -v hatch_gws_cli
          command -v hatch_messenger_cli
          hatch_gws_cli
          hatch_messenger_cli
          echo "validate: inert delegates resolve on PATH and exit 0"

      - name: Syntax-check every shell script
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/rc"
          fail=0
          for f in bin/leakage-audit bin/leakage-report bin/adversarial-run \
                   test/stub-memory-skill/bin/egress-gate \
                   test/stub-memory-skill/bin/brief-gate \
                   test/stub-memory-skill/bin/memory-egress-check \
                   test/stub-memory-skill/bin/memory-guard \
                   test/stub-memory-skill/bin/patterns.sh \
                   test/stub-memory-skill/bin/shims/hatch_gws_cli \
                   test/stub-memory-skill/bin/shims/hatch_messenger_cli \
                   test/stub-memory-skill/build/build-blockset.sh; do
            if [ ! -f "$f" ]; then echo "missing script: $f" >&2; fail=1;
            elif ! bash -n "$f"; then echo "syntax error: $f" >&2; fail=1; fi
          done
          echo "$fail" > "${{ runner.temp }}/rc/syntax"
          exit 0

      - name: Check the stub block set is current
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/rc"
          test/stub-memory-skill/build/build-blockset.sh --check
          echo "$?" > "${{ runner.temp }}/rc/blockset"
          exit 0

      - name: Run the leakage audit against the synthetic stub
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 10
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/rc"
          # MOCHI_EGRESS_LOG is exported here (not in job-level env:): the
          # `runner` context is unavailable in job-level `env:` — GitHub
          # rejects the whole workflow ("No jobs were run"). It IS
          # available in `run:` scripts. $RUNNER_TEMP is the
          # runner-provided env var for the same directory.
          export MOCHI_EGRESS_LOG="$RUNNER_TEMP/egress-gate.log"
          # Fail-at-the-end: capture the audit's own exit code explicitly
          # (PIPESTATUS, not pipefail) so a red audit still yields logs and
          # the report, and the job outcome is decided by the final assert
          # step — never by an early abort that hides diagnostics.
          export PATH="$PERSONAL_MEMORY_SKILL/bin/shims:$PATH"
          MOCHI_AUDIT_MACHINE=1 MOCHI_REPORT_WIDTH=48 \
            bin/leakage-audit 2>&1 | tee "${{ runner.temp }}/audit.log"
          echo "${PIPESTATUS[0]}" > "${{ runner.temp }}/rc/audit"
          exit 0

      - name: Assert the pinned CI skip set (no silent new skips)
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/rc"
          # CI reality (fresh runner, stub skill): exactly 4 skips —
          #   1. cron prompt dirs not configured
          #   2. memory-audit run (opt-in; the stub ships no memory-audit binary)
          #   3. no egress denylist (CI has no denylist file)
          #   4. gate log not found (fresh CI log; no sends attempted yet)
          # Pinned from machine sentinels (@@@ CHECK SKIP), never prose.
          # A new skip reason, or a different count, fails the run.
          if [ ! -f "${{ runner.temp }}/audit.log" ]; then
            echo "validate: FAIL — audit.log missing (audit did not run)" >&2
            echo 1 > "${{ runner.temp }}/rc/skip-assert"
            exit 0
          fi
          mapfile -t skip_lines < <(grep -a '^@@@ CHECK SKIP' "${{ runner.temp }}/audit.log" || true)
          echo "skip count: ${#skip_lines[@]}"
          printf '%s\n' "${skip_lines[@]}"
          fail=0
          [ "${#skip_lines[@]}" -eq 4 ] || { echo "validate: expected exactly 4 skips" >&2; fail=1; }
          for reason in 'cron prompt dirs not configured' 'memory-audit run' \
                        'no egress denylist' 'gate log not found'; do
            printf '%s\n' "${skip_lines[@]}" | grep -q "$reason" \
              || { echo "validate: missing skip reason: $reason" >&2; fail=1; }
          done
          [ "$fail" -eq 0 ] && echo "validate: skip set matches the pinned expectation"
          echo "$fail" > "${{ runner.temp }}/rc/skip-assert"
          exit 0

      - name: Assert pinned validation composition (no vacuous green)
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 2
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/rc"
          # Deleting audit cases or corpus cases must not stay green. The
          # pinning comes from machine sentinels, never prose greps; when the
          # harness intentionally gains or loses checks, this pin is updated
          # in the same commit as the check change.
          # Pinned as of the iteration that added fail-closed detector probes
          # plus red-team coverage of reply-all / -- / drafts send / settings
          # mutations / messenger edit (stub target: 87 checks total, 4 of
          # which are the pinned CI skips; adversarial corpus: 36 cases),
          # then the iteration that added write-time guard probes
          # (bin/memory-guard presence/parses in suite A, six memory-guard
          # probes in suite C — stub target: 95 checks total, still 4 pinned
          # CI skips; adversarial corpus unchanged at 36 cases), then the
          # iteration that added no-args/idle-pipe probes (two guard tree-
          # scan probes, one egress idle-pipe probe) plus MEMORY_PUBLIC_PATTERNS
          # class-exemption probes (two guard, two egress), taught the stub
          # gates the exemption with block-tier-first evaluation, switched
          # the patterns probe's secret fixture to a declared block-tier
          # token, and added the 39th adversarial case (Google Sheets
          # ?gid=<9-digit> real-world false-positive shape; the corpus case
          # reuses an already-declared synthetic 9-digit fixture value so
          # the fixture-purity check and the blockset stay consistent)
          # — stub target: 98 checks
          # total, still 4 pinned CI skips; adversarial corpus: 39 cases.
          fail=0
          if [ ! -f "${{ runner.temp }}/audit.log" ]; then
            echo "validate: FAIL — audit.log missing (audit did not run)" >&2; fail=1
          else
            t="$(grep -a '^@@@ TOTAL ' "${{ runner.temp }}/audit.log" | tail -n 1 || true)"
            if [ "$t" = "@@@ TOTAL 98 0 4" ]; then
              echo "validate: audit composition pinned (98 passed · 0 failed · 4 skipped)"
            else
              echo "validate: FAIL — expected '@@@ TOTAL 98 0 4', got '$t'" >&2; fail=1
            fi
          fi
          if [ ! -f "${{ runner.temp }}/adversarial.log" ]; then
            echo "validate: FAIL — adversarial.log missing (suite did not run)" >&2; fail=1
          else
            a="$(grep -a '^@@@ ADV MATCHED ' "${{ runner.temp }}/adversarial.log" | tail -n 1 || true)"
            if [ "$a" = "@@@ ADV MATCHED 39/39" ]; then
              echo "validate: adversarial composition pinned (39/39 cases matched)"
            else
              echo "validate: FAIL — expected '@@@ ADV MATCHED 39/39', got '$a'" >&2; fail=1
            fi
          fi
          echo "$fail" > "${{ runner.temp }}/rc/composition-assert"
          exit 0

      - name: Run the adversarial suite against the synthetic stub
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/rc"
          # PIPESTATUS[0] preserves the runner's exit code through tee; a
          # bare pipe would let a failing suite report a green step.
          bin/adversarial-run 2>&1 | tee "${{ runner.temp }}/adversarial.log"
          echo "${PIPESTATUS[0]}" > "${{ runner.temp }}/rc/adversarial"
          exit 0

      - name: Generate the HTML validation report
        id: report
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -uo pipefail
          mkdir -p "${{ runner.temp }}/rc"
          # Same as the audit step above: MOCHI_EGRESS_LOG is exported here,
          # not in job-level env: (the `runner` context is unavailable
          # there).
          export MOCHI_EGRESS_LOG="$RUNNER_TEMP/egress-gate.log"
          export PATH="$PERSONAL_MEMORY_SKILL/bin/shims:$PATH"
          # Exit 1 (findings/mismatches) still writes the report — that is
          # the point of fail-at-the-end. Only 2/3 (refused/tooling
          # failure), a missing file, or a missing stub banner is a red
          # report component.
          bin/leakage-report --out "${{ runner.temp }}/leakage-validation.html" \
            2>&1 | tee "${{ runner.temp }}/report.log"
          rep_rc="${PIPESTATUS[0]}"
          if [ "$rep_rc" -eq 0 ] || [ "$rep_rc" -eq 1 ]; then
            if ! grep -q 'SYNTHETIC STUB TARGET' "${{ runner.temp }}/leakage-validation.html" 2>/dev/null; then
              echo "validate: FAIL — report is missing the stub banner" >&2
              rep_rc=3
            fi
          fi
          echo "$rep_rc" > "${{ runner.temp }}/rc/report"
          if [ -f "${{ runner.temp }}/leakage-validation.html" ]; then
            echo "report_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_exists=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload the validation report
        id: upload
        if: always() && steps.refuse-livefire.outcome == 'success' && steps.refuse-localenv.outcome == 'success' && steps.report.outputs.report_exists == 'true'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: leakage-validation-report
          path: ${{ runner.temp }}/leakage-validation.html
          retention-days: 14
          if-no-files-found: error

      - name: Summarize the validation
        if: always()
        timeout-minutes: 2
        run: |
          # Informational only: never fails the job. Every figure comes
          # from an anchored @@@ machine sentinel; a missing sentinel is
          # reported as "unavailable", never silently dropped.
          RC_DIR="${{ runner.temp }}/rc"
          rc() { local f="$RC_DIR/$1"; [ -f "$f" ] && cat "$f" || echo "not-run"; }
          # Debug annotations: surface rc values and sentinel lines where
          # log downloads are unavailable.
          for k in syntax blockset audit skip-assert composition-assert adversarial report; do
            echo "::notice::rc/$k=$(rc "$k")"
          done
          if [ -f "${{ runner.temp }}/audit.log" ]; then
            echo "::notice::audit-total=$(grep -a '^@@@ TOTAL ' "${{ runner.temp }}/audit.log" | tail -n 1 || echo MISSING)"
          else
            echo "::notice::audit-log=MISSING"
          fi
          if [ -f "${{ runner.temp }}/adversarial.log" ]; then
            echo "::notice::adv-matched=$(grep -a '^@@@ ADV MATCHED ' "${{ runner.temp }}/adversarial.log" | tail -n 1 || echo MISSING)"
          else
            echo "::notice::adversarial-log=MISSING"
          fi
          SYNTAX_RC="$(rc syntax)"; BLOCKSET_RC="$(rc blockset)"
          AUDIT_RC="$(rc audit)"; SKIP_RC="$(rc skip-assert)"
          COMP_RC="$(rc composition-assert)"
          ADV_RC="$(rc adversarial)"; REP_RC="$(rc report)"

          audit_detail="audit figures unavailable — see step log"
          if [ -f "${{ runner.temp }}/audit.log" ]; then
            t="$(grep -a '^@@@ TOTAL ' "${{ runner.temp }}/audit.log" | tail -n 1 || true)"
            v="$(grep -a '^@@@ VERDICT ' "${{ runner.temp }}/audit.log" | tail -n 1 || true)"
            m="$(grep -a '^@@@ MODE ' "${{ runner.temp }}/audit.log" | tail -n 1 || true)"
            if [ -n "$t" ] && [ -n "$v" ]; then
              # shellcheck disable=SC2086
              set -- $t  # @@@ TOTAL <pass> <fail> <skipped>
              vv="${v#@@@ VERDICT }"   # "VERDICT: CLEAN — …"
              vv="${vv#VERDICT: }"      # "CLEAN — …"
              audit_detail="$3 passed · $4 failed · $5 skipped — $vv"
              [ -n "$m" ] && audit_detail="$audit_detail (${m#@@@ MODE } mode)"
            fi
          fi

          skip_detail="skip figures unavailable — see step log"
          if [ -f "${{ runner.temp }}/audit.log" ]; then
            n="$(grep -ac '^@@@ CHECK SKIP ' "${{ runner.temp }}/audit.log" || true)"
            skip_detail="$n/4 pinned CI skips present"
          fi

          adv_detail="adversarial figures unavailable — see step log"
          if [ -f "${{ runner.temp }}/adversarial.log" ]; then
            a="$(grep -a '^@@@ ADV MATCHED ' "${{ runner.temp }}/adversarial.log" | tail -n 1 || true)"
            ti="$(grep -a '^@@@ ADV TIERS ' "${{ runner.temp }}/adversarial.log" | tail -n 1 || true)"
            if [ -n "$a" ]; then
              adv_detail="${a#@@@ ADV MATCHED } matched"
              [ -n "$ti" ] && adv_detail="$adv_detail (${ti#@@@ ADV TIERS })"
            fi
          fi

          comp_detail="composition figures unavailable — see step log"
          comp_detail="$( [ -f "$RC_DIR/composition-assert" ] && [ "$(cat "$RC_DIR/composition-assert")" = "0" ] && echo "audit 98/0/4 + adversarial 39/39 pinned" || echo "$comp_detail" )"

          rep_detail="report not generated"
          if [ "${{ steps.report.outputs.report_exists }}" = "true" ]; then
            case "$REP_RC" in
              0) rep_detail="report written (exit 0 — CLEAN)" ;;
              1) rep_detail="report written (exit 1 — findings/mismatches, see report)" ;;
              *) rep_detail="report written but runner exit was $REP_RC — treat as suspect" ;;
            esac
          fi

          art_detail="artifact not uploaded"
          [ "${{ steps.upload.outcome }}" = "success" ] && art_detail="artifact uploaded"

          mark() { case "$1" in 0) echo "✅ rc=0";; not-run) echo "⏭️ not run";; *) echo "❌ rc=$1";; esac; }

          # Explicit outcome word, derived from component exit codes.
          outcome="INCOMPLETE"; outcome_note=""
          if [ "${{ steps.refuse-livefire.outcome }}" != "success" ] || \
             [ "${{ steps.refuse-localenv.outcome }}" != "success" ]; then
            outcome="BLOCKED"; outcome_note=" — safety precondition failed (see Refuse steps); no component ran"
          else
            red=""
            [ "$SYNTAX_RC" != "0" ] && red="$red syntax"
            [ "$BLOCKSET_RC" != "0" ] && red="$red blockset"
            [ "$AUDIT_RC" != "0" ] && red="$red audit"
            [ "$SKIP_RC" != "0" ] && red="$red skip-assert"
            [ "$COMP_RC" != "0" ] && red="$red composition-assert"
            [ "$ADV_RC" != "0" ] && red="$red adversarial"
            case "$REP_RC" in 0|1) ;; *) red="$red report";; esac
            [ "${{ steps.report.outputs.report_exists }}" != "true" ] && red="$red report(missing)"
            if [ -z "$red" ]; then outcome="CLEAN"; else outcome="ATTENTION"; outcome_note=" — red:$red"; fi
          fi

          {
            echo "## Leakage validation (synthetic stub)"
            echo ""
            echo "_Green here proves harness self-consistency against the bundled test double — not protection of any real installation._"
            echo ""
            echo "- **Outcome: $outcome**$outcome_note"
            echo ""
            echo "All figures below come from anchored \`@@@\` machine sentinels in the step logs."
            echo ""
            echo "| Component | Status | Detail |"
            echo "|---|---|---|"
            echo "| Syntax check | $(mark "$SYNTAX_RC") | bash -n over audit, report, adversarial runner, blockset builder, stub gates |"
            echo "| Blockset | $(mark "$BLOCKSET_RC") | build-blockset.sh --check (blockset current) |"
            echo "| Audit | $(mark "$AUDIT_RC") | $audit_detail |"
            echo "| Pinned CI skips | $(mark "$SKIP_RC") | $skip_detail |"
            echo "| Pinned composition | $(mark "$COMP_RC") | $comp_detail |"
            echo "| Adversarial | $(mark "$ADV_RC") | $adv_detail |"
            echo "| Report | $(mark "$REP_RC") | $rep_detail |"
            echo "| Artifact | $art_detail | leakage-validation.html |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert green (fail the job if any component is red)
        if: always()
        timeout-minutes: 2
        run: |
          set -uo pipefail
          RC_DIR="${{ runner.temp }}/rc"
          rc() { local f="$RC_DIR/$1"; [ -f "$f" ] && cat "$f" || echo "not-run"; }
          fail=0
          # Safety preconditions first: a refused run is a failed run.
          if [ "${{ steps.refuse-livefire.outcome }}" != "success" ]; then
            echo "::error::Refuse live-fire variables step did not succeed — job blocked." >&2; fail=1
          fi
          if [ "${{ steps.refuse-localenv.outcome }}" != "success" ]; then
            echo "::error::Refuse committed local.env step did not succeed — job blocked." >&2; fail=1
          fi
          check() { # <name> <rc> — 0 required
            if [ "$2" != "0" ]; then
              echo "::error::$1 is red (rc=$2) — see the step log and the uploaded report." >&2; fail=1
            fi
          }
          check "syntax check" "$(rc syntax)"
          check "blockset check" "$(rc blockset)"
          check "audit" "$(rc audit)"
          check "skip-set assertion" "$(rc skip-assert)"
          check "composition assertion" "$(rc composition-assert)"
          check "adversarial corpus" "$(rc adversarial)"
          # Report: exit 1 means findings with a written report (diagnostic;
          # still red overall via the audit/adversarial rc). Only 2/3 or a
          # missing file fails this component.
          rep_rc="$(rc report)"
          case "$rep_rc" in
            0|1)
              if [ "${{ steps.report.outputs.report_exists }}" != "true" ]; then
                echo "::error::report step exited $rep_rc but no report file exists." >&2; fail=1
              fi ;;
            *) echo "::error::report step is red (rc=$rep_rc)." >&2; fail=1 ;;
          esac
          if [ "$fail" -ne 0 ]; then
            echo "ASSERT: one or more components are red — failing the job at the end, after all diagnostics ran." >&2
            exit 1
          fi
          echo "ASSERT: all components green."
